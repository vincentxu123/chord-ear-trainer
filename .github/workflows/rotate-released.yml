name: Refresh private RELEASED rotation

on:
  schedule:
    # Sunday night in Chicago: 5:17 a.m. CDT / 4:17 a.m. CST.
    - cron: '17 10 * * 0'
  workflow_dispatch:
    inputs:
      smoke_only:
        description: 'Check the hosted recording environment and playlist without processing songs'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: private-released-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      RECORDINGS_PYTHON: python
      VERCEL_ORG_ID: team_iPsBNrUsuT4W3lwqafZsxAkm
      VERCEL_PROJECT_ID: prj_CxRVhAGJ6zS5wAKhcw02rrPr25ia
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check alternating Sunday and deployment token
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SMOKE_ONLY: ${{ inputs.smoke_only }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import date, datetime, timezone
          from pathlib import Path

          today = datetime.now(timezone.utc).date()
          due = today.weekday() == 6 and (today - date(2026, 10, 4)).days % 14 == 0
          manual = os.environ['EVENT_NAME'] == 'workflow_dispatch'
          smoke = manual and os.environ.get('SMOKE_ONLY') == 'true'
          run = manual or due
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'run={str(run).lower()}\n')
              output.write(f'smoke={str(smoke).lower()}\n')
          print(f'UTC date: {today}; rotation due: {due}; smoke only: {smoke}')
          if run and not smoke and not os.environ.get('VERCEL_TOKEN'):
              raise SystemExit('VERCEL_TOKEN secret is required before processing songs')
          PY

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Install FFmpeg and dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm ci
          npm run songs:setup

      - name: Check playlist and recording environment
        if: steps.gate.outputs.run == 'true'
        run: |
          npm run songs:doctor
          npm run songs:rotate -- --list-only

      - name: Process each playlist song once
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.smoke != 'true'
        run: npm run songs:rotate -- --device cpu

      - name: Verify app and offline pack
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.smoke != 'true'
        run: |
          npm test
          npm run build
          python3 scripts/recordings/verify_rotation_pack.py

      - name: Deploy successful pack to protected stable URL
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.smoke != 'true'
        run: npx --yes vercel@62.1.0 deploy --prod --yes --token "$VERCEL_TOKEN"
